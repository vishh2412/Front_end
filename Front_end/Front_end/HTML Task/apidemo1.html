<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>

     <table class="table ">
        <thead>
            <tr>
                <th scope="col">id</th>
                <th scope="col">firstName</th>
                <th scope="col">lastName</th>
                <th scope="col">MaidName</th>
                <th scope="col">age</th>
                <th scope="col">Gender</th>
                <th scope="col">Email</th>
                <th scope="col">phone</th>
                <th scope="col">username</th>
                <th scope="col">password</th>
                <th scope="col">Birthday</th>
                <th scope="col">image</th>
                <th scope="col">blood group</th>
                <th scope="col">height</th>
                <th scope="col">weight</th>
                <th scope="col">eye color</th>
                <th scope="col">hair</th>
                
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>
    <script>

        fetch("https://dummyjson.com/users?limit=10",{
            method: "GET",
        })
        
         .then((res)=>{
            return res.json()
        })
        
        .then((res)=>{
            console.log(res)
             let htmldata = res.map((data,index)=>{
                console.log(data)
                return(
                    `
                    <tr>
                        <td>${data.id}</td>
                        <td>${data.firstName} ${data.lastName}</td>
                        <td>${data.maidenName}</td>
                        <td>${data.lastName}</td>
                        <td>${data.age}</td>
                        <td>${data.gender}</td>
                        <td>${data.email}</td>
                        <td>${data.phone}</td>
                        <td>${data.username}</td>
                        <td>${data.password}</td>
                        <td>${data.birthday}</td>
                        <td><img src="${data.image}" alt="Profile Image" style="width: 50px; height: 50px;"></td>
                        <td>${data.bloodGroup}</td>
                        <td>${data.height}</td>
                        <td>${data.weight}</td>
                        <td>${data.eyeColor}</td>
                        <td>${data.hair.color}</td>
                        <td>${data.hair.type}</td>

                    </tr>
                    `
                )
        })

        document.querySelector("tbody").innerHTML = htmldata.join("")
           
    })
    </script>
</body>

</html>
